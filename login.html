<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Login – HFT ARBITRAG</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-blue-900 flex items-center justify-center text-white">


<div class="bg-slate-800/60 backdrop-blur p-10 rounded-2xl w-full max-w-md border border-slate-700">
<h2 class="text-3xl font-bold mb-6 text-center">تسجيل الدخول</h2>


<input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full mb-4 p-3 rounded bg-slate-900 border border-slate-700">
<input id="password" type="password" placeholder="كلمة المرور" class="w-full mb-6 p-3 rounded bg-slate-900 border border-slate-700">


<button onclick="login()" class="w-full bg-blue-600 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">دخول</button>


<p class="text-center text-slate-400 mt-4">ليس لديك حساب؟ <a href="register.html" class="text-blue-400">إنشاء حساب</a></p>
</div>


<script>
async function login(){
localStorage.setItem('hft_token','demo_token');
window.location.href='dashboard.html';
}
</script>
</body>
</html>
