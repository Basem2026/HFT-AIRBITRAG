
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>Register – HFT ARBITRAG</title>

</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-purple-900 flex items-center justify-center text-white">

<script>
function register(){
window.location.href='login.html';
}
</script>
</body>
</html>
